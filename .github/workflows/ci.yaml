name: CI

on:
  pull_request: {}
  push:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: oxid2fa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, pdo_mysql, sodium, bcmath, curl, intl, xml, zip
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Static analysis (phpcs, phpstan, phpmd)
        run: composer static

      - name: Unit tests
        run: vendor/bin/phpunit --config=tests/ --testsuite=Unit

      - name: Database tests (SQL, atomicity with parallel processes, migration)
        env:
          OXID2FA_REQUIRE_DB: '1'
          OXID2FA_TEST_DB_HOST: 127.0.0.1
          OXID2FA_TEST_DB_PORT: '3306'
          OXID2FA_TEST_DB_USER: root
          OXID2FA_TEST_DB_PASSWORD: root
        run: vendor/bin/phpunit --config=tests/ --testsuite=Database
